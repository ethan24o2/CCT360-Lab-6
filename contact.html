<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — Loop &amp; Path</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar md:navbar-expand bg-1">
        <div class="container">
          <a class="navbar-brand" href="index.html">Loop &amp; Path</a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="drawer"
            data-bs-target="#mainDrawer"
            aria-controls="mainDrawer"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="drawer" id="mainDrawer" tabindex="-1" aria-labelledby="mainDrawerLabel">
            <div class="drawer-header">
              <h2 class="drawer-title h5" id="mainDrawerLabel">Loop &amp; Path</h2>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="drawer"
                aria-label="Close"
              ></button>
            </div>
            <div class="drawer-body">
              <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                  <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#">Trail Map</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link active" aria-current="page" href="contact.html">Contact</a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main class="container my-4">
      <h1 class="mb-3">Suggest a Loop or Say Hello</h1>
      <p class="mb-4">
        Know a quiet neighborhood path or have a trail surface update? Send a note below.
      </p>

      <form class="row g-3">
        <div class="form-field col-12 md:col-6">
          <label for="first-name">First name</label>
          <input id="first-name" type="text" class="form-control" required />
        </div>

        <div class="form-field col-12 md:col-6">
          <label for="last-name">Last name</label>
          <input id="last-name" type="text" class="form-control" required />
        </div>

        <div class="form-field col-12 md:col-6">
          <label for="email">Email address</label>
          <input
            id="email"
            type="email"
            class="form-control"
            placeholder="alex@example.com"
            required
          />
        </div>

        <div class="form-field col-12 md:col-6">
          <label for="topic">Inquiry topic</label>
          <select id="topic" class="form-control">
            <option value="suggest-loop">Suggest a new walk loop</option>
            <option value="trail-update">Report a trail condition update</option>
            <option value="general-question">General directory question</option>
          </select>
        </div>

        <div class="form-field col-12 md:col-6">
          <label for="message">Message</label>
          <textarea id="message" rows="4" class="form-control" required></textarea>
        </div>

        <div class="form-field col-12 md:col-6">
          <input id="consent" type="checkbox" class="check" required />
          <label for="consent">I agree to be contacted regarding my trail note</label>
        </div>

        <div class="col-12">
          <button type="submit" class="btn-solid theme-primary">Send Message</button>
        </div>
      </form>
    </main>

    <footer class="bg-1 py-4 mt-5">
      <div class="container">
        <p class="mb-0">Loop &amp; Path — Neighborhood Walk &amp; Park Loop Directory</p>
      </div>
    </footer>

    <script type="module" src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
